# Publishes the next Usage for Claude blog post waiting in ClaudeUsage/blog/_queue/, one a week.
# Run it by hand from the Actions tab (Run workflow) to publish the next one now.
name: ClaudeUsage weekly blog post

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC (09:00 in Israel)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: claudeusage-weekly-post

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish the next queued post
        id: publish
        run: node ClaudeUsage/blog/publish-next.js
      - name: Commit, push and rebuild the site
        if: steps.publish.outputs.slug != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.publish.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ClaudeUsage/blog sitemap.xml ClaudeUsage/index.html
          git commit -m "ClaudeUsage blog: publish \"$TITLE\" (weekly post)"
          git push
          # a push made with GITHUB_TOKEN may not start a Pages build on its own
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
