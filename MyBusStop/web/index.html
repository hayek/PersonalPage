<!DOCTYPE html>

<head>

    <title>My Bus Stop on the web – Live bus arrival times in your browser</title>
    <meta name="description" content="Live bus arrival times in your browser, free and with no sign-up. Pick the stop you use every day and up to three lines, and watch the next buses come in on the route map.">

    <meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)">

    <meta property="og:image" content="https://amirhayek.dev/MyBusStop/Assets/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
